<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>АВТОПОДБОР — профессиональный подбор автомобилей в России</title>
    <meta name="description" content="Профессиональный автоподбор в России. Найдём автомобиль, который стоит своих денег. Проверка, диагностика, юридическое сопровождение." />
    <meta property="og:title" content="АВТОПОДБОР — профессиональный подбор автомобилей" />
    <meta property="og:description" content="Найдём автомобиль, который стоит своих денег. Проверка, диагностика, юридическое сопровождение." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0a0a0a" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet" />

    <style>
        /* ===== БАЗОВЫЕ СТИЛИ (как раньше) ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1a1a1a;
            --bg-card-hover: #222222;
            --bg-input: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #777777;
            --accent: #e63946;
            --accent-hover: #ff4d5a;
            --accent-dim: rgba(230, 57, 70, 0.15);
            --border-color: #2a2a2a;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --max-width: 1200px;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        a {
            color: var(--text-primary);
            text-decoration: none;
            transition: var(--transition);
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ===== КНОПКИ ===== */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 14px 36px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            letter-spacing: 0.3px;
            min-height: 54px;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(230, 57, 70, 0.35);
        }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: transparent;
            color: var(--text-primary);
            border: 2px solid var(--border-color);
            padding: 12px 32px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            min-height: 50px;
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        .btn-small {
            padding: 10px 24px;
            font-size: 0.85rem;
            min-height: 42px;
        }

        /* ===== ШАПКА ===== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            transition: var(--transition);
        }

        .header.scrolled {
            background: rgba(10, 10, 10, 0.95);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .logo span {
            color: var(--accent);
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav a {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            position: relative;
            transition: var(--transition);
            padding: 4px 0;
        }

        .nav a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: var(--transition);
        }

        .nav a:hover {
            color: var(--text-primary);
        }

        .nav a:hover::after {
            width: 100%;
        }

        .nav-phone {
            font-weight: 600;
            color: var(--text-primary) !important;
            font-size: 0.95rem !important;
            letter-spacing: 0.2px;
        }

        .nav-phone::after {
            display: none !important;
        }

        .nav-phone:hover {
            color: var(--accent) !important;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            z-index: 1001;
        }

        .menu-toggle span {
            display: block;
            width: 28px;
            height: 2.5px;
            background: var(--text-primary);
            border-radius: 2px;
            transition: var(--transition);
            transform-origin: center;
        }

        .menu-toggle.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .menu-toggle.active span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        .menu-toggle.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* ===== ГЛАВНЫЙ ЭКРАН ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            padding-top: 72px;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at 70% 50%, rgba(230, 57, 70, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 30% 80%, rgba(230, 57, 70, 0.05) 0%, transparent 50%),
                var(--bg-primary);
        }

        .hero-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.3;
            filter: grayscale(0.2) brightness(0.5);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 700px;
            padding: 40px 0 60px;
        }

        .hero-badge {
            display: inline-block;
            background: var(--accent-dim);
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 18px;
            border-radius: 50px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 24px;
            border: 1px solid rgba(230, 57, 70, 0.2);
            animation: pulse-badge 2s ease-in-out infinite;
        }

        @keyframes pulse-badge {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.03);
            }
        }

        .hero h1 {
            font-size: clamp(2.6rem, 7vw, 4.8rem);
            font-weight: 800;
            line-height: 1.08;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
        }

        .hero h1 .highlight {
            color: var(--accent);
            position: relative;
        }

        .hero p {
            font-size: clamp(1.05rem, 1.5vw, 1.3rem);
            color: var(--text-secondary);
            max-width: 540px;
            margin-bottom: 36px;
            line-height: 1.7;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }

        .hero-actions .btn-primary {
            font-size: 1.05rem;
            padding: 16px 44px;
        }

        .hero-stats {
            display: flex;
            gap: 40px;
            margin-top: 48px;
            padding-top: 32px;
            border-top: 1px solid var(--border-color);
        }

        .hero-stats-item {
            display: flex;
            flex-direction: column;
        }

        .hero-stats-item .number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .hero-stats-item .label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* ===== СЕКЦИИ ===== */
        .section {
            padding: 80px 0;
        }

        .section-header {
            margin-bottom: 48px;
        }

        .section-header .subtitle {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .section-header h2 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.15;
        }

        .section-header h2 .highlight {
            color: var(--accent);
        }

        .section-header p {
            color: var(--text-secondary);
            max-width: 560px;
            margin-top: 12px;
            font-size: 1.05rem;
        }

        .section-header.center {
            text-align: center;
        }

        .section-header.center p {
            margin-left: auto;
            margin-right: auto;
        }

        /* ===== УСЛУГИ ===== */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .service-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 32px 28px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent);
            opacity: 0;
            transition: var(--transition);
        }

        .service-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .service-card:hover::before {
            opacity: 1;
        }

        .service-icon {
            font-size: 2.2rem;
            margin-bottom: 16px;
            display: inline-block;
            background: var(--accent-dim);
            padding: 12px;
            border-radius: 12px;
            line-height: 1;
        }

        .service-card h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .service-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .service-price {
            display: inline-block;
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 4px 16px;
            border-radius: 50px;
            border: 1px solid rgba(230, 57, 70, 0.15);
        }

        /* ===== КАК МЫ РАБОТАЕМ ===== */
        .steps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
        }

        .step-item {
            text-align: center;
            padding: 28px 16px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            position: relative;
        }

        .step-item:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
            transform: translateY(-4px);
        }

        .step-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 16px;
        }

        .step-item h4 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .step-item p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* ===== ПРЕИМУЩЕСТВА ===== */
        .benefits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
        }

        .benefit-item {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 28px 24px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            text-align: center;
        }

        .benefit-item:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            background: var(--bg-card-hover);
        }

        .benefit-icon {
            font-size: 2.4rem;
            margin-bottom: 12px;
            display: block;
        }

        .benefit-item h4 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .benefit-item p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* ===== НОВОЕ: БЛОК С ЦИФРАМИ ===== */
        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        .number-item {
            text-align: center;
            padding: 32px 20px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .number-item:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
        }

        .number-item .big-number {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 8px;
        }

        .number-item .number-label {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* ===== АВТОМОБИЛИ ===== */
        .cars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
        }

        .car-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .car-card:hover {
            border-color: var(--accent);
            transform: translateY(-6px);
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.5);
        }

        .car-image {
            width: 100%;
            height: 200px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .car-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .car-card:hover .car-image img {
            transform: scale(1.03);
        }

        .car-image .car-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--accent);
            color: #fff;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .car-info {
            padding: 20px 22px 24px;
        }

        .car-info .car-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .car-info .car-year {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .car-specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 16px;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }

        .car-specs .spec {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .car-specs .spec .label {
            color: var(--text-muted);
        }

        .car-specs .spec .value {
            color: var(--text-primary);
            font-weight: 500;
        }

        .car-price {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent);
            margin-top: 4px;
        }

        .car-price small {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        /* ===== ОТЗЫВЫ ===== */
        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .review-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 28px 24px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .review-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
        }

        .review-stars {
            color: #fbbf24;
            font-size: 1.1rem;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .review-card blockquote {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-style: italic;
            line-height: 1.7;
            margin-bottom: 16px;
        }

        .review-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .review-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--accent);
            flex-shrink: 0;
        }

        .review-author .name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .review-author .detail {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* ===== КОНТАКТЫ ===== */
        .contacts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
        }

        .contacts-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .contact-item:hover {
            border-color: var(--accent);
        }

        .contact-item .icon {
            font-size: 1.5rem;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-dim);
            border-radius: 10px;
            flex-shrink: 0;
        }

        .contact-item .info {
            display: flex;
            flex-direction: column;
        }

        .contact-item .info .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .contact-item .info .value {
            font-weight: 600;
            font-size: 1rem;
        }

        .contact-item .info .value a {
            color: var(--text-primary);
        }

        .contact-item .info .value a:hover {
            color: var(--accent);
        }

        .contacts-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }

        .contacts-actions .btn-primary,
        .contacts-actions .btn-outline {
            flex: 1;
            min-width: 140px;
        }

        /* ===== ФОРМА ===== */
        .form-wrapper {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 40px;
            border: 1px solid var(--border-color);
        }

        .form-wrapper h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-wrapper .form-sub {
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: var(--font);
            transition: var(--transition);
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 24px 0 20px;
        }

        .form-checkbox input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-top: 2px;
            flex-shrink: 0;
            accent-color: var(--accent);
            cursor: pointer;
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            appearance: none;
            -webkit-appearance: none;
            transition: var(--transition);
            position: relative;
        }

        .form-checkbox input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        .form-checkbox input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
        }

        .form-checkbox label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            cursor: pointer;
        }

        .form-checkbox label a {
            color: var(--accent);
            text-decoration: underline;
        }

        .form-checkbox label a:hover {
            color: var(--accent-hover);
        }

        .form-error {
            color: var(--accent);
            font-size: 0.85rem;
            margin-top: 4px;
            display: none;
        }

        .form-error.visible {
            display: block;
        }

        .form-success {
            display: none;
            padding: 20px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: var(--radius-sm);
            color: #4ade80;
            text-align: center;
            margin-top: 16px;
        }

        .form-success.visible {
            display: block;
        }

        /* ===== НОВОЕ: ЧАСТО ЗАДАВАЕМЫЕ ВОПРОСЫ (FAQ) ===== */
        .faq-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .faq-item {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            padding: 20px 24px;
            transition: var(--transition);
            cursor: pointer;
        }

        .faq-item:hover {
            border-color: var(--accent);
        }

        .faq-item .faq-question {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .faq-item .faq-question .faq-toggle {
            color: var(--accent);
            font-size: 1.2rem;
            transition: var(--transition);
        }

        .faq-item .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .faq-item.open .faq-answer {
            max-height: 300px;
            padding-top: 14px;
        }

        .faq-item.open .faq-toggle {
            transform: rotate(45deg);
        }

        /* ===== НОВОЕ: БЛОК "МЫ РАБОТАЕМ С" (партнёры) ===== */
        .partners-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            padding: 20px 0;
        }

        .partner-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: var(--transition);
            opacity: 0.6;
        }

        .partner-item:hover {
            opacity: 1;
            color: var(--text-primary);
        }

        .partner-item .partner-icon {
            font-size: 2.8rem;
        }

        /* ===== НОВОЕ: КНОПКА "НАВЕРХ" ===== */
        .scroll-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            transition: var(--transition);
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            box-shadow: 0 4px 20px rgba(230, 57, 70, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scroll-top.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .scroll-top:hover {
            background: var(--accent-hover);
            transform: translateY(-4px);
        }

        /* ===== COOKIE БАННЕР ===== */
        .cookie-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            padding: 20px 24px;
            display: none;
            transition: var(--transition);
        }

        .cookie-banner.visible {
            display: block;
        }

        .cookie-banner-inner {
            max-width: var(--max-width);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            flex-wrap: wrap;
        }

        .cookie-banner p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            flex: 1;
            min-width: 200px;
        }

        .cookie-banner p a {
            color: var(--accent);
            text-decoration: underline;
        }

        .cookie-banner .cookie-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .cookie-banner .btn-primary {
            padding: 10px 28px;
            font-size: 0.85rem;
            min-height: 44px;
        }

        .cookie-banner .btn-outline {
            padding: 10px 28px;
            font-size: 0.85rem;
            min-height: 44px;
        }

        /* ===== ПОДВАЛ ===== */
        .footer {
            border-top: 1px solid var(--border-color);
            padding: 32px 0;
            margin-top: 20px;
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .footer p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .footer a {
            color: var(--text-muted);
            transition: var(--transition);
        }

        .footer a:hover {
            color: var(--accent);
        }

        .footer-links {
            display: flex;
            gap: 20px;
        }

        /* ===== АДАПТИВНОСТЬ ===== */
        @media (max-width: 992px) {
            .contacts-grid {
                grid-template-columns: 1fr;
            }
            .form-wrapper {
                padding: 28px;
            }
            .faq-grid {
                grid-template-columns: 1fr;
            }
            .numbers-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 768px) {
            .header-inner {
                height: 64px;

                font-size: 1.3rem;

            }

                right: 0;
            }
